# Local / single-host stack. API and worker share one image (see Dockerfile).
#   docker compose up --build -d          # postgres + weaviate + api + worker
#   docker compose up -d --scale worker=3 # more import workers
# `.env` is loaded when present; the x-knowledge-env block below overrides the
# addresses so containers talk to the compose services.
x-knowledge-env: &knowledge-env
  DATABASE_URL: postgresql://knowledge:knowledge@postgres:5432/knowledge?gssencmode=disable
  WEAVIATE_URL: http://weaviate:8080
  WEAVIATE_HOST: weaviate
  WEAVIATE_PORT: "8080"
  WEAVIATE_GRPC_PORT: "50051"
  WAREHOUSE_MOCK_ROOT: /data/mock_warehouse
  LOCAL_FILE_CONNECTOR_ROOT: /data/local_sources

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
    ports:
      - "5432:5432"
    volumes:
      - knowledge-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ANN accelerator for hybrid retrieval. Optional: the service falls back to the
  # Postgres unit-vector backend when VECTOR_STORE_MODE is left at "db".
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.0
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - knowledge-weaviate-data:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v1/.well-known/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    image: knowledge:local
    env_file:
      - path: .env
        required: false
    environment:
      <<: *knowledge-env
    ports:
      - "8000:8000"
    volumes:
      - knowledge-app-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  worker:
    image: knowledge:local
    command: ["python", "-m", "knowledge.workers.runner"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *knowledge-env
      # Empty => the runner derives a unique name from the container hostname,
      # so scaled replicas never share a task lease identity.
      WORKER_NAME: ""
    volumes:
      - knowledge-app-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  knowledge-postgres-data:
  knowledge-weaviate-data:
  knowledge-app-data:
