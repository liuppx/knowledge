[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge"
version = "0.1.0"
description = "Knowledge operations and publishing service."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["knowledge*"]

[tool.setuptools.package-data]
knowledge = [
    "templates/*.html",
    "static/css/*.css",
    "static/js/*.js",
    "third_party/SOURCES.md",
    "third_party/onyx/LICENSE",
    "third_party/onyx/connectors/README.md",
    "third_party/ragflow/LICENSE",
    "third_party/ragflow/deepdoc/parser/resume/entities/res/*.csv",
    "third_party/ragflow/deepdoc/parser/resume/entities/res/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
